<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="results-section.css">
  <link rel="stylesheet" href="summary-section.css">
  <link rel="stylesheet" href="media.css">
  <title>Results summary component</title>
  <link rel="stylesheet" href="icon" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,500;0,700;0,800;1,500;1,700;1,800&display=swap" rel="stylesheet">
</head> 
<body>
  <main>
    <article class="results-container">
      <section class="result-section">
        <h1 class="result-heading">Your Result</h1>

        <div class="result-score">
          <span class="calculated-score">76</span>
          
          <span class="final-score">of 100</span>
        </div>

        <strong>Great</strong>

        <p class="result-description">You scored higher than 65% of the people who have taken these tests.</p>
      </section>

      <section class="summary-section">
        <h2 class="summary-heading">Summary</h2>

        <ul>
          <li class="type reaction">
            <div class="img-name">
              <img src="./images/icon-reaction.svg" alt="">
              
              <span class="reaction-name">Reaction</span>
            </div>
            
            <div>
              <span class="summary-calculated">80</span>
              
              <span class="summary-final">/ 100</span>
            </div>
          </li>
          
          <li class="type memory">
            <div class="img-name">
              <img src="./images/icon-memory.svg" alt="">
              
              <span class="memory-name">Memory</span>
            </div>
            
            <div class="summary-calculation">
              <span class="summary-calculated">92</span>
              
              <span class="summary-final">/ 100</span>
            </div>
          </li>
          
          <li class="type verbal">
            <div class="img-name">
              <img src="./images/icon-verbal.svg" alt="">
              
              <span class="verbal-name">Verbal</span>
            </div>
            
            <div>
              <span class="summary-calculated">61</span>
              
              <span class="summary-final">/ 100</span>
            </div>
          </li>
          
            <li class="type visual">
            <div class="img-name">
              <img src="./images/icon-visual.svg" alt="">
              
              <span class="visual-name">Visual</span>
            </div>
            
            <div>
              <span class="summary-calculated">73</span>
              
              <span class="summary-final">/ 100</span>
            </div>
          </li>

        </ul>

        <button class="continue-button" type="button">Continue</button>
      </section>
    </article>
  </main>
</body>
</html>
